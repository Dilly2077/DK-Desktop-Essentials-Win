name: Build Windows UI

on:
  push:
    branches:
      - main
      - "module/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET 8 and 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup Node for UI syntax check
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Validate UI JavaScript
        shell: pwsh
        run: |
          node --check .\src\DKDesktopEssentials\ui\app2.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check .\src\DKDesktopEssentials\ui\workspace-rail.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore main app
        shell: pwsh
        run: dotnet restore .\src\DKDesktopEssentials\DKDesktopEssentials.csproj

      - name: Restore controller output host
        shell: pwsh
        run: dotnet restore .\src\DKControllerOutputHost\DKControllerOutputHost.csproj

      - name: Build main app
        shell: pwsh
        run: dotnet build .\src\DKDesktopEssentials\DKDesktopEssentials.csproj -c Release --no-restore

      - name: Build controller output host
        shell: pwsh
        run: dotnet build .\src\DKControllerOutputHost\DKControllerOutputHost.csproj -c Release --no-restore

      - name: Publish controller output host
        shell: pwsh
        run: >-
          dotnet publish .\src\DKControllerOutputHost\DKControllerOutputHost.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishReadyToRun=false
          -o .\artifacts\controller-output-host

      - name: Controller Hub completion and reliability tests
        shell: pwsh
        run: .\scripts\Test-ControllerHub.ps1 -HelperPath .\artifacts\controller-output-host\DKControllerOutputHost.exe

      - name: Validate pinned official libraries and offline SDK loading
        shell: pwsh
        run: .\scripts\Test-ProviderReleasePins.ps1 -HelperPath .\artifacts\controller-output-host\DKControllerOutputHost.exe

      - name: Upload controller test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Controller-Hub-test-results
          path: .\artifacts\controller-tests\*.json
          if-no-files-found: warn

      - name: Publish self-contained Windows x64 build
        shell: pwsh
        run: >-
          dotnet publish .\src\DKDesktopEssentials\DKDesktopEssentials.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishReadyToRun=false
          -o .\artifacts\DK-Desktop-Essentials-win-x64

      - name: Bundle controller output host
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts\DK-Desktop-Essentials-win-x64\controller-output-host | Out-Null
          Copy-Item .\artifacts\controller-output-host\* .\artifacts\DK-Desktop-Essentials-win-x64\controller-output-host\ -Recurse -Force

      - name: Verify Windows bundle
        shell: pwsh
        run: .\scripts\Verify-WindowsBundle.ps1

      - name: Upload Windows build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DK-Desktop-Essentials-win-x64
          path: .\artifacts\DK-Desktop-Essentials-win-x64\
          if-no-files-found: error
